; Overrides the image defaults (loaded last: zzz-app.conf).
[www]
; No user/group here: the pod's securityContext sets the identity.

; nginx in the same pod reaches php-fpm over localhost.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Used by the probes via cgi-fcgi.
ping.path = /ping
ping.response = pong

; Configuration comes from the environment, so it must not be scrubbed.
clear_env = no

; Send php errors and access logs to the container log.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
