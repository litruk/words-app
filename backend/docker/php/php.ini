; Runtime tuning for the Slovnik API.

memory_limit = 256M
expose_php = Off
date.timezone = UTC

; A dictionary lookup waits for Gemini (30s HTTP timeout).
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code ships inside the image and never changes under a running pod.
opcache.validate_timestamps = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
