# nginx inside the pod: serves public/ and hands PHP to the php-fpm container
# over localhost. TLS and the public domain stay on the host nginx, which
# proxies to this service's NodePort.

# Laravel needs to know the original scheme; the host nginx passes it on.
map $http_x_forwarded_proto $fcgi_https {
    default "";
    https   on;
}

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 1m;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/graphql-response+json text/plain text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fcgi_https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        # A dictionary lookup waits for Gemini.
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
