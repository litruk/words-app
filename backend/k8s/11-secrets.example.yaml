# Template only - do not commit real values. Create the secret directly instead:
#
#   kubectl -n words create secret generic words-secrets \
#       --from-literal=APP_KEY="base64:$(openssl rand -base64 32)" \
#       --from-literal=DB_PASSWORD="$(openssl rand -hex 24)" \
#       --from-literal=GEMINI_API_KEY='...'
#
# APP_KEY must never change once the app has users: Sanctum tokens and the
# password reset tokens are tied to it.
apiVersion: v1
kind: Secret
metadata:
  name: words-secrets
  namespace: words
type: Opaque
stringData:
  APP_KEY: base64:REPLACE_ME
  DB_PASSWORD: REPLACE_ME
  GEMINI_API_KEY: REPLACE_ME
