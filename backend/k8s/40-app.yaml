apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: words
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - name: http
      port: 8080
      targetPort: http
      # The host nginx proxies to 127.0.0.1:30081; keep the two in sync.
      # (30080 belongs to receipt-app on the same node.)
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: words
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # Drop this if you make the GHCR packages public.
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: php-fpm
          image: ghcr.io/litruk/words-api:latest
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: words-config
            - secretRef:
                name: words-secrets
          # The entrypoint warms the artisan caches before php-fpm starts, so
          # give it room before the readiness gate applies.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi

        - name: nginx
          image: ghcr.io/litruk/words-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
